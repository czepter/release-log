# Plain Docker Compose: build the image from this repository, keep the SQLite
# index in a named volume, put your own TLS terminator in front of it.
#
#   cp .env.example .env    # fill it in, BASE_URL is the public URL
#   docker compose up -d --build

services:
  release-log:
    build: .
    image: release-log:1.0.0
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/release-log.sqlite
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - release-log-data:/data

volumes:
  release-log-data:
